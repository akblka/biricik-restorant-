<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birecik Asistan</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #1a472a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
        }

        #chatbox { 
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .message { 
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .bot { 
            background-color: rgba(0, 100, 0, 0.3);
            color: #d4af37;
        }

        .user { 
            background-color: rgba(0, 0, 100, 0.3);
            color: white;
            text-align: right;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        input[type="text"] { 
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        button { 
            padding: 10px 20px;
            background-color: #d4af37;
            color: #1a472a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #c19b2e;
        }

        .discount-message { 
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .menu-item-name {
            color: #d4af37;
        }

        .menu-item-price {
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="chatbox">
            <div class="message bot discount-message">Hey! Buradan sipariş verirsen %10 indirim kazanırsın! 🎉</div>
            <div class="message bot">Merhaba! Ben Birecik. Size nasıl yardımcı olabilirim? 😊</div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
            <button onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        const menu = [
            { name: "Adana Kebap", price: 120 },
            { name: "Urfa Kebap", price: 115 },
            { name: "Lahmacun", price: 40 },
            { name: "Çiğ Köfte", price: 35 },
            { name: "Ayran", price: 15 },
            { name: "Menemen", price: 45 },
            { name: "Sucuklu Yumurta", price: 40 },
            { name: "Serpme Kahvaltı", price: 120 },
            { name: "Mercimek Çorbası", price: 35 },
            { name: "İşkembe Çorbası", price: 40 },
            { name: "Ezogelin Çorbası", price: 35 },
            { name: "Patlıcan Kebabı", price: 85 },
            { name: "Tavuk Şiş", price: 75 },
            { name: "Künefe", price: 65 },
            { name: "Katmer", price: 60 },
            { name: "Sütlaç", price: 35 },
            { name: "Çoban Salata", price: 45 },
            { name: "Şevketi Bostan", price: 40 },
            { name: "Mevsim Salata", price: 40 },
            { name: "Humus", price: 45 },
            { name: "Muhammara", price: 45 },
            { name: "Acılı Ezme", price: 40 },
            { name: "Şalgam", price: 15 },
            { name: "Limonata", price: 20 },
            { name: "Kola", price: 15 }
        ];

        const orders = [];

        function sendMessage() {
            const input = document.getElementById("userInput");
            const msg = input.value.trim();
            if (!msg) return;

            appendMessage("user", msg);
            respondToUser(msg.toLowerCase());
            input.value = "";
        }

        function appendMessage(sender, text) {
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            div.innerText = text;
            document.getElementById("chatbox").appendChild(div);
            document.getElementById("chatbox").scrollTop = document.getElementById("chatbox").scrollHeight;
        }

        function respondToUser(msg) {
            // Dış konulara yanıt vermez
            if (!msg.includes("menü") && !msg.includes("sipariş") && !msg.includes("şikayet") && !msg.includes("öneri") && !msg.includes("adres") && !msg.includes("telefon") && !msg.includes("isim") && !menu.some(item => msg.includes(item.name.toLowerCase()))) {
                appendMessage("bot", "Üzgünüm, sadece restoranımızla ilgili konularda yardımcı olabilirim. 😊");
                return;
            }

            // Menü
            if (msg.includes("menü")) {
                const menuText = menu.map(m => `${m.name} - ${m.price} TL`).join("\n");
                appendMessage("bot", "Menümüzde şunlar var:\n" + menuText);
                return;
            }

            // Sipariş
            for (const item of menu) {
                if (msg.includes(item.name.toLowerCase())) {
                    orders.push(item);
                    appendMessage("bot", `${item.name} siparişinize eklendi. Başka bir şey ister misiniz? 😊`);
                    return;
                }
            }

            // İletişim bilgisi alma
            if (msg.includes("adres") || msg.includes("telefon") || msg.includes("isim")) {
                appendMessage("bot", "Lütfen adınız, adresiniz ve telefon numaranızı şu formatta yazınız:\nAd Soyad: ...\nAdres: ...\nTelefon: ...");
                return;
            }

            // Siparişi onayla
            if (msg.includes("tamamla") || msg.includes("gönder")) {
                if (orders.length === 0) {
                    appendMessage("bot", "Henüz bir siparişiniz yok. Önce menüden bir şey seçin. 😊");
                    return;
                }
                const total = orders.reduce((sum, item) => sum + item.price, 0);
                const discount = total * 0.1;
                const finalTotal = total - discount;
                const summary = orders.map(o => o.name).join(", ");
                appendMessage("bot", `Siparişiniz alındı: ${summary}\nToplam: ${total} TL\nİndirim: ${discount} TL\nÖdemeniz gereken: ${finalTotal} TL\nHazırlanıp en kısa sürede gönderilecektir. 😊`);
                orders.length = 0;
                return;
            }

            // Şikayet/öneri
            if (msg.includes("şikayet") || msg.includes("öneri")) {
                appendMessage("bot", "Görüşlerinizi not ettim, yöneticimize iletilecek. Geri bildiriminiz için teşekkür ederiz. 😊");
                return;
            }

            appendMessage("bot", "Lütfen daha fazla bilgi verin veya menümüzden ürün seçin. 😊");
        }

        // Enter tuşu ile mesaj gönderme
        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
