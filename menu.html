<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birecik - Menü</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a472a;
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .brand-line {
            width: 200px;
            height: 2px;
            background-color: #d4af37;
            margin: 10px auto;
        }

        .specialties {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: white;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-card {
            background-color: var(--secondary-color);
            padding: 0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 250px;
            margin: 0 auto;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .category-card h2 {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 1.2rem;
        }

        .category-card:hover {
            transform: scale(1.05);
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .menu-items {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            padding: 1rem;
        }

        .menu-item {
            background-color: var(--secondary-color);
            padding: 1rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .menu-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }

        .menu-item-info {
            flex: 1;
        }

        .menu-item h3 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1rem;
        }

        .menu-item p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .price {
            font-weight: bold;
            color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .menu-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
                padding: 0.5rem;
            }

            .category-card {
                max-width: 200px;
            }

            .category-card h2 {
                font-size: 1rem;
                padding: 10px;
            }

            .menu-items {
                grid-template-columns: 1fr;
            }

            .menu-item {
                padding: 0.8rem;
            }

            .menu-item img {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Birecik</h1>
            <div class="brand-line"></div>
            <p class="specialties">Menü</p>
        </header>

        <div class="menu-container">
            <div class="category-card" onclick="window.location.href='breakfast.html'">
                <img src="images/kahvalti.jpg" alt="Kahvaltı">
                <h2>Kahvaltı</h2>
            </div>
            <div class="category-card" onclick="window.location.href='soups.html'">
                <img src="images/corba.jpg" alt="Çorbalar">
                <h2>Çorbalar</h2>
            </div>
            <div class="category-card" onclick="window.location.href='main-dishes.html'">
                <img src="images/kebap.jpg" alt="Ana Yemekler">
                <h2>Ana Yemekler</h2>
            </div>
            <div class="category-card" onclick="window.location.href='appetizers.html'">
                <img src="images/ara-sicak.jpg" alt="Ara Sıcaklar">
                <h2>Ara Sıcaklar</h2>
            </div>
            <div class="category-card" onclick="window.location.href='desserts.html'">
                <img src="images/tatli.jpg" alt="Tatlılar">
                <h2>Tatlılar</h2>
            </div>
            <div class="category-card" onclick="window.location.href='salads.html'">
                <img src="images/salata.jpg" alt="Salatalar">
                <h2>Salatalar</h2>
            </div>
            <div class="category-card" onclick="window.location.href='mezes.html'">
                <img src="images/meze.jpg" alt="Mezeler">
                <h2>Mezeler</h2>
            </div>
            <div class="category-card" onclick="window.location.href='beverages.html'">
                <img src="images/icecek.jpg" alt="İçecekler">
                <h2>İçecekler</h2>
            </div>
        </div>

        <div id="menu-items" class="menu-items"></div>
    </div>

    <script src="script.js"></script>
    <script>
        function showMenu(category) {
            const menuItems = document.getElementById('menu-items');
            menuItems.style.display = 'grid';
            
            const menuData = {
                'breakfast': [
                    { name: 'Menemen', price: '₺45', image: 'images/menemen.jpg' },
                    { name: 'Sucuklu Yumurta', price: '₺40', image: 'images/sucuklu-yumurta.jpg' },
                    { name: 'Serpme Kahvaltı', price: '₺120', image: 'images/serpme.jpg' }
                ],
                'soups': [
                    { name: 'Mercimek Çorbası', price: '₺35', image: 'images/mercimek.jpg' },
                    { name: 'İşkembe Çorbası', price: '₺40', image: 'images/iskembe.jpg' },
                    { name: 'Ezogelin Çorbası', price: '₺35', image: 'images/ezogelin.jpg' }
                ],
                'main-dishes': [
                    { name: 'Urfa Kebabı', price: '₺120', image: 'images/urfa-kebap.jpg' },
                    { name: 'Adana Kebabı', price: '₺110', image: 'images/adana-kebap.jpg' },
                    { name: 'Lahmacun', price: '₺45', image: 'images/lahmacun.jpg' }
                ],
                'appetizers': [
                    { name: 'Patlıcan Kebabı', price: '₺85', image: 'images/patlican-kebap.jpg' },
                    { name: 'Tavuk Şiş', price: '₺75', image: 'images/tavuk-sis.jpg' }
                ],
                'desserts': [
                    { name: 'Künefe', price: '₺60', image: 'images/kunefe.jpg' },
                    { name: 'Katmer', price: '₺55', image: 'images/katmer.jpg' }
                ],
                'salads': [
                    { name: 'Çoban Salata', price: '₺35', image: 'images/coban-salata.jpg' },
                    { name: 'Gavurdağı Salatası', price: '₺40', image: 'images/gavurdagi.jpg' }
                ],
                'mezes': [
                    { name: 'Humus', price: '₺35', image: 'images/humus.jpg' },
                    { name: 'Acılı Ezme', price: '₺35', image: 'images/acili-ezme.jpg' }
                ],
                'beverages': [
                    { name: 'Ayran', price: '₺15', image: 'images/ayran.jpg' },
                    { name: 'Şalgam', price: '₺20', image: 'images/salgam.jpg' }
                ]
            };

            const items = menuData[category] || [];
            menuItems.innerHTML = items.map(item => `
                <div class="menu-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="menu-item-info">
                        <h3>${item.name}</h3>
                        <p class="price">${item.price}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
